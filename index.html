<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Maker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Anton', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            background: #ffffff;
            border: 3px solid #2c3e50;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            animation: slideInFromBottom 0.8s ease-out;
            position: relative;
            z-index: 10;
        }

        .container:hover {
            box-shadow: 15px 15px 0 rgba(0, 0, 0, 0.1);
            transform: translate(-5px, -5px);
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 3px solid #3498db;
            display: inline-block;
            padding-bottom: 10px;
            animation: fadeInDown 1s ease-out 0.3s both;
        }

        .subtitle {
            color: #555;
            font-size: 1.3rem;
            margin: 20px 0;
            line-height: 1.6;
            font-weight: bold;
            animation: fadeIn 1s ease-out 0.6s both;
            letter-spacing: 1px;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            margin: 20px 0;
            line-height: 1.6;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .btn-click-here {
            display: inline-block;
            background: #2c3e50;
            color: #ffffff;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 3px solid #2c3e50;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            animation: pulse 2s infinite, fadeInUp 1s ease-out 0.9s both;
            margin-top: 20px;
        }

        .btn-click-here:hover {
            background: #3498db;
            border-color: #3498db;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            animation-play-state: paused;
        }

        .btn-click-here:active {
            transform: translateY(0) scale(0.95);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
        }

        /* Shine effect */
        .btn-click-here::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shine 3s infinite;
        }

        /* Particles container */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: #ffffff;
            opacity: 0.3;
            animation: float linear infinite;
        }

        /* Floating squares background */
        .floating-squares {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .square {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: rotateSquare 20s linear infinite;
        }

        /* Keyframe Animations */
        @keyframes slideInFromBottom {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes shine {
            0% {
                left: -100%;
            }
            50% {
                left: 100%;
            }
            100% {
                left: 100%;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
            }
        }

        @keyframes rotateSquare {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.5);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .btn-click-here {
                padding: 15px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating squares background -->
    <div class="floating-squares" id="floatingSquares"></div>
    
    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <div class="container" id="mainContainer">
        <h1>Quest Maker</h1>
        <div class="subtitle">Click Here</div>
        <p>Make Quest To Take Money Now</p>
        <a href="https://vuotnhanh.com/RxIa" class="btn-click-here" target="_blank" title="Quest Maker - Click Here">
            Click Here
        </a>
    </div>

    <script>
        // Tạo particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random size
                const size = Math.random() * 10 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // Random position
                particle.style.left = Math.random() * 100 + '%';
                
                // Random animation duration
                const duration = Math.random() * 10 + 10;
                particle.style.animationDuration = duration + 's';
                
                // Random delay
                particle.style.animationDelay = Math.random() * 5 + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        // Tạo floating squares
        function createFloatingSquares() {
            const squaresContainer = document.getElementById('floatingSquares');
            const squareCount = 10;
            
            for (let i = 0; i < squareCount; i++) {
                const square = document.createElement('div');
                square.className = 'square';
                
                // Random size
                const size = Math.random() * 100 + 50;
                square.style.width = size + 'px';
                square.style.height = size + 'px';
                
                // Random position
                square.style.left = Math.random() * 90 + '%';
                square.style.top = Math.random() * 90 + '%';
                
                // Random animation duration
                const duration = Math.random() * 15 + 15;
                square.style.animationDuration = duration + 's';
                
                // Random delay
                square.style.animationDelay = Math.random() * 10 + 's';
                
                squaresContainer.appendChild(square);
            }
        }

        // Thêm event listeners cho các hiệu ứng
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            createFloatingSquares();
            
            // Thêm hiệu ứng mouse move
            document.addEventListener('mousemove', (e) => {
                const container = document.getElementById('mainContainer');
                const rect = container.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                const deltaX = (e.clientX - centerX) / 50;
                const deltaY = (e.clientY - centerY) / 50;
                
                container.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            });
            
            // Reset transform khi mouse leave
            document.addEventListener('mouseleave', () => {
                const container = document.getElementById('mainContainer');
                container.style.transform = 'translate(0, 0)';
            });
        });
    </script>
</body>
</html>
