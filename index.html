<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VuotLinkFun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            background-image: radial-gradient(circle at 50% 0%, #1a2332 0%, #0d1117 70%);
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-content {
            max-width: 800px;
            width: 100%;
            padding: 0 20px;
            text-align: center;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.4;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .title span {
            color: #ff4d4d;
            text-shadow: 0 0 15px rgba(255, 77, 77, 0.4);
        }

        .subtitle {
            font-size: 15px;
            color: #8b949e;
            margin-bottom: 35px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .btn {
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .btn-primary {
            background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(46, 160, 67, 0.3);
            border: 1px solid #3fb950;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(46, 160, 67, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6e40c9 0%, #8957e5 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(137, 87, 229, 0.3);
            border: 1px solid #a371f7;
        }

        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(137, 87, 229, 0.5);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .title { font-size: 24px; }
            .subtitle { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <h1 class="title">
            Bạn sẽ được chuyển hướng trang vượt link<br>
            <span>link4m.net</span>
        </h1>
        
        <p class="subtitle">Hệ thống đang kiểm tra an toàn, vui lòng bấm "Tiếp tục".</p>

        <div class="btn-group">
            <a href="#" id="btnContinue" class="btn btn-primary" onclick="handleContinue(event)">
                <span id="btnText">Tiếp tục</span>
                <div id="loadingSpinner" class="spinner"></div>
                <svg id="btnIcon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            </a>
            
            <a href="https://kenhmatchat-executor.vercel.app/" target="_blank" class="btn btn-secondary">
                <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                Liên kết tài trợ
            </a>
        </div>
    </div>

    <script>
        function handleContinue(event) {
            event.preventDefault(); 
            
            const btn = document.getElementById('btnContinue');
            const text = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');
            const icon = document.getElementById('btnIcon');

            text.innerText = "Đang xử lý...";
            spinner.style.display = "block";
            icon.style.display = "none";
            btn.style.pointerEvents = "none";
            btn.style.opacity = "0.8";

            setTimeout(() => {
                // ==========================================
                // THAY LINK VƯỢT LINK CỦA BẠN VÀO DƯỚI ĐÂY:
                // ==========================================
                const yourTargetLink = "https://link4m.net/..."; 
                
                if (yourTargetLink !== "https://link4m.net/..." && yourTargetLink !== "") {
                    window.location.href = yourTargetLink;
                } else {
                    alert("Vui lòng cập nhật link vượt link vào code!");
                    text.innerText = "Tiếp tục";
                    spinner.style.display = "none";
                    icon.style.display = "block";
                    btn.style.pointerEvents = "auto";
                    btn.style.opacity = "1";
                }
            }, 1500); 
        }
    </script>

</body>
</html>
