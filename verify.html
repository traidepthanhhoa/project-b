<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xác Minh | Matchat67</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />

<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

<style>
:root, [data-theme="dark"] {
  --bg: #0a0a0a;
  --surface: #111111;
  --surface-2: #171717;
  --surface-hover: #1c1c1c;
  --line: #262626;
  --line-strong: #333;
  --text: #fafafa;
  --text-soft: #b0b0b0;
  --muted: #7a7a7a;
  --purple: #a78bfa;
  --pink: #f472b6;
  --cyan: #22d3ee;
  --green: #34d399;
  --red: #f87171;
  --amber: #fbbf24;
  --shadow-toast: 0 8px 24px rgba(0, 0, 0, .4);
  --shadow-modal: 0 24px 60px rgba(0, 0, 0, .45);
  --shadow-thumb: 0 2px 6px rgba(0, 0, 0, .25);
  --selection-bg: #a78bfa;
  --selection-text: #000;
  --t: 180ms cubic-bezier(.2, .8, .2, 1);
  --t-theme: 300ms cubic-bezier(.4, 0, .2, 1);
  --radius: 4px;
  --radius-lg: 10px;
}
[data-theme="light"] {
  --bg: #fbfbfd;
  --surface: #ffffff;
  --surface-2: #f5f5f7;
  --surface-hover: #eef0f4;
  --line: #e4e4e9;
  --line-strong: #c9c9d1;
  --text: #1c1c22;
  --text-soft: #4b4b55;
  --muted: #6b6b75;
  --purple: #6d28d9;
  --pink: #db2777;
  --cyan: #0891b2;
  --green: #059669;
  --red: #dc2626;
  --amber: #d97706;
  --shadow-toast: 0 8px 24px rgba(0, 0, 0, .12);
  --shadow-modal: 0 24px 60px rgba(0, 0, 0, .18);
  --shadow-thumb: 0 2px 6px rgba(0, 0, 0, .15);
  --selection-bg: #6d28d9;
  --selection-text: #ffffff;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  line-height: 1.5;
  transition: background var(--t-theme), color var(--t-theme);
  display: flex;
  flex-direction: column;
}
::selection { background: var(--selection-bg); color: var(--selection-text); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; border-radius: 2px; }
button, a, input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

.site-header {
  padding: 60px 24px 32px;
  text-align: center;
  animation: riseIn .5s ease both;
}
.site-header h1 {
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1.05;
  color: var(--text);
}
.site-header p {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-top: 16px;
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.header-actions {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 24px;
  flex-wrap: wrap;
}
.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px 6px 6px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  transition: background var(--t), border-color var(--t), color var(--t), transform var(--t);
}
.theme-toggle:hover {
  border-color: var(--line-strong);
  color: var(--text);
  transform: translateY(-1px);
}
.theme-toggle-track {
  position: relative;
  width: 44px;
  height: 24px;
  background: var(--surface-2);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}
.theme-toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--purple);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .35s cubic-bezier(.5, 1.6, .4, 1), background var(--t-theme);
  box-shadow: var(--shadow-thumb);
}
[data-theme="light"] .theme-toggle-thumb {
  transform: translateX(20px);
  background: var(--amber);
}
.theme-toggle .icon {
  width: 11px;
  height: 11px;
  stroke-width: 2.5;
  transition: opacity .25s ease, transform .35s ease;
  position: absolute;
}
[data-theme="dark"] .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg) scale(.5); }
[data-theme="dark"] .theme-toggle .icon-moon { opacity: 1; transform: rotate(0) scale(1); color: #fff; }
[data-theme="light"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0) scale(1); color: #fff; }
[data-theme="light"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(.5); }
.theme-toggle-label { min-width: 40px; text-align: left; }

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 24px 60px;
}

.verify-card {
  width: 100%;
  max-width: 460px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 36px 32px;
  position: relative;
  overflow: hidden;
  animation: riseIn .5s ease .1s both;
}
.verify-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--purple), var(--pink), var(--cyan));
}

.verify-icon-wrap {
  width: 72px;
  height: 72px;
  margin: 0 auto 22px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulseGlow 2.5s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 24px rgba(167, 139, 250, .35); }
  50% { box-shadow: 0 0 48px rgba(167, 139, 250, .65); }
}
.verify-icon-wrap svg { width: 34px; height: 34px; color: #fff; stroke-width: 2.5; }

.verify-title {
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: -.02em;
  color: var(--text);
  text-align: center;
  margin-bottom: 8px;
}
.verify-title::after {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--purple);
  border-radius: 50%;
  margin-left: 8px;
  vertical-align: middle;
  animation: blink 1.2s steps(2, end) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.verify-sub {
  text-align: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 24px;
}

.captcha-box {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 16px;
}
.captcha-label {
  display: block;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .14em;
  margin-bottom: 12px;
  text-align: center;
}
.captcha-row {
  display: flex;
  align-items: stretch;
  justify-content: center;
  gap: 10px;
}
.captcha-question {
  font-family: "JetBrains Mono", monospace;
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--purple);
  padding: 14px 20px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  white-space: nowrap;
  display: flex;
  align-items: center;
  letter-spacing: .04em;
}
.captcha-input {
  flex: 1;
  min-width: 0;
  max-width: 120px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  color: var(--text);
  font-family: "JetBrains Mono", monospace;
  font-size: 1.25rem;
  font-weight: 800;
  text-align: center;
  outline: none;
  transition: all var(--t);
  -webkit-appearance: none;
  appearance: none;
}
.captcha-input::placeholder { color: var(--muted); opacity: .6; }
.captcha-input:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px rgba(167, 139, 250, .15);
}
.captcha-input.error {
  border-color: var(--red);
  animation: shake .4s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* TERMS CHECKBOX */
.terms-checkbox {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 16px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  cursor: pointer;
  transition: all var(--t);
  user-select: none;
}
.terms-checkbox:hover { border-color: var(--purple); }
.terms-checkbox input {
  width: 18px;
  height: 18px;
  margin-top: 1px;
  accent-color: var(--purple);
  cursor: pointer;
  flex-shrink: 0;
}
.terms-checkbox span {
  font-size: .82rem;
  color: var(--text-soft);
  line-height: 1.5;
}
.terms-checkbox a {
  color: var(--purple);
  text-decoration: underline;
  font-weight: 700;
  cursor: pointer;
}
.terms-checkbox a:hover { color: var(--pink); }

/* BUTTON */
.verify-btn {
  width: 100%;
  padding: 14px 18px;
  border: 1px solid var(--purple);
  border-radius: var(--radius);
  background: var(--purple);
  color: #000;
  font-family: inherit;
  font-size: .88rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all var(--t);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 48px;
}
.verify-btn:hover:not(:disabled) {
  background: var(--pink);
  border-color: var(--pink);
  color: #fff;
  transform: translateY(-2px);
}
.verify-btn:active { transform: translateY(0); }
.verify-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}
.verify-btn svg { width: 18px; height: 18px; stroke-width: 2.5; }

.verify-error {
  margin-top: 14px;
  padding: 10px 14px;
  background: rgba(248, 113, 113, .1);
  border: 1px solid var(--red);
  color: var(--red);
  border-radius: var(--radius);
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  letter-spacing: .04em;
  text-align: center;
  display: none;
}
.verify-error.show { display: block; animation: shake .4s; }

.verify-note {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .08em;
  text-transform: uppercase;
  line-height: 1.6;
  text-align: center;
}
.verify-note strong { color: var(--pink); }

/* FOOTER */
footer {
  text-align: center;
  padding: 24px;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .1em;
  text-transform: uppercase;
  border-top: 1px solid var(--line);
}
.footer-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.footer-links button {
  background: none;
  border: 0;
  color: var(--text-soft);
  padding: 6px 10px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--t);
  text-transform: uppercase;
  letter-spacing: .08em;
}
.footer-links button:hover {
  color: var(--purple);
  background: var(--surface-2);
}
footer small {
  display: block;
  margin-top: 6px;
  font-size: 9px;
  opacity: .6;
}

/* TOAST */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 10000;
  pointer-events: none;
  max-width: calc(100vw - 48px);
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  color: var(--text);
  font-size: .88rem;
  font-weight: 600;
  box-shadow: var(--shadow-toast);
  pointer-events: auto;
  animation: toastIn .35s cubic-bezier(.2, .8, .2, 1) both;
  min-width: 220px;
  max-width: 380px;
}
.toast.toast-out { animation: toastOut .3s cubic-bezier(.4, 0, 1, 1) both; }
.toast-icon { width: 18px; height: 18px; flex-shrink: 0; }
.toast.success { border-color: var(--green); }
.toast.success .toast-icon { color: var(--green); }
.toast.error { border-color: var(--red); }
.toast.error .toast-icon { color: var(--red); }
.toast.info { border-color: var(--purple); }
.toast.info .toast-icon { color: var(--purple); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toastOut { to { opacity: 0; transform: translateX(30px); } }

/* INFO MODAL */
.info-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9998;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s ease, visibility .25s ease;
}
.info-overlay.show { opacity: 1; visibility: visible; }
.info-modal {
  width: 100%;
  max-width: 620px;
  max-height: 88vh;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-modal);
  transform: translateY(16px) scale(.97);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.info-overlay.show .info-modal { transform: translateY(0) scale(1); }
.info-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.info-head h3 {
  font-size: 1.05rem;
  font-weight: 800;
  letter-spacing: -.01em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}
.info-head h3 .info-eyebrow {
  font-size: .68rem;
  text-transform: uppercase;
  color: var(--purple);
  letter-spacing: .1em;
  font-weight: 700;
}
.info-close {
  width: 40px;
  height: 40px;
  border: 0;
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  transition: all var(--t);
  flex-shrink: 0;
}
.info-close svg { width: 18px; height: 18px; }
.info-close:hover { background: var(--surface-2); color: var(--text); }
.info-body {
  padding: 22px;
  overflow-y: auto;
  flex: 1;
  color: var(--text-soft);
  font-size: .9rem;
  line-height: 1.7;
}
.info-body h4 {
  color: var(--purple);
  font-size: 1rem;
  font-weight: 800;
  margin: 18px 0 8px;
}
.info-body h4:first-child { margin-top: 0; }
.info-body p { margin: 0 0 12px; }
.info-body ul { padding-left: 22px; margin: 0 0 12px; }
.info-body li { margin-bottom: 5px; }
.info-body a { color: var(--purple); text-decoration: underline; font-weight: 600; }
.info-body a:hover { color: var(--pink); }

@media (max-width: 500px) {
  .site-header { padding: 40px 20px 24px; }
  .site-header h1 { font-size: 1.6rem; }
  .verify-card { padding: 28px 22px; }
  .verify-icon-wrap { width: 60px; height: 60px; }
  .verify-icon-wrap svg { width: 28px; height: 28px; }
  .verify-title { font-size: 1.2rem; }
  .captcha-question { font-size: 1.2rem; padding: 12px 16px; }
  .captcha-input { font-size: 1.1rem; max-width: 90px; }
  .toast-container {
    bottom: 16px;
    right: 16px;
    left: 16px;
    max-width: none;
  }
  .toast { width: 100%; min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<header class="site-header">
  <h1>Xác Minh Robot</h1>
  <p>Verify you are human</p>

  <div class="header-actions">
    <button class="theme-toggle" id="themeToggle" type="button"
            aria-label="Chuyển chế độ sáng/tối">
      <span class="theme-toggle-track" aria-hidden="true">
        <span class="theme-toggle-thumb">
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </span>
      </span>
      <span class="theme-toggle-label" data-role="theme-label">Dark</span>
    </button>
  </div>
</header>

<main>
  <div class="verify-card">
    <div class="verify-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <polyline points="9 12 11 14 15 10" />
      </svg>
    </div>

    <h2 class="verify-title">Kiểm tra bảo mật</h2>
    <p class="verify-sub">Giải phép tính để tiếp tục</p>

    <div class="captcha-box">
      <label class="captcha-label" for="captchaInput">🔒 Xác minh bạn là người</label>
      <div class="captcha-row">
        <div class="captcha-question" id="captchaQuestion">1 + 1 = ?</div>
        <input
          type="number"
          class="captcha-input"
          id="captchaInput"
          placeholder="?"
          autocomplete="off"
          inputmode="numeric"
        />
      </div>
    </div>

    <label class="terms-checkbox">
      <input type="checkbox" id="agreeTerms">
      <span>
        I have read and agree to the
        <a href="#" onclick="event.preventDefault(); openInfo('terms')">Terms</a>
        and the
        <a href="#" onclick="event.preventDefault(); openInfo('privacy')">Privacy</a>
      </span>
    </label>

    <button id="verifyBtn" class="verify-btn" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12" />
      </svg>
      <span>XÁC MINH</span>
    </button>

    <div class="verify-error" id="verifyError"></div>

    <p class="verify-note">
      Sau khi xác minh, web sẽ tự mở khóa<br>
      <strong>⏱️ Hiệu lực: 7 ngày</strong>
    </p>
  </div>
</main>

<footer>
  <div class="footer-links">
    <button type="button" onclick="openInfo('about')">About</button>

const themeLabel = document.querySelector('[data-role="theme-label"]');
function updateThemeLabel(theme) {
  if (themeLabel) themeLabel.textContent = theme === 'dark' ? 'Dark' : 'Light';
}
updateThemeLabel(document.documentElement.getAttribute('data-theme') || 'dark');
themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(VERIFY_CONFIG.themeKey, next);
  updateThemeLabel(next);
});
document.addEventListener('keydown', (e) => {

};
function showToast(message, type = 'info', duration = 3000) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = (TOAST_ICONS[type] || TOAST_ICONS.info) + `<span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('toast-out');
    toast.addEventListener('animationend', () => toast.remove(), { once: true });
    setTimeout(() => toast.remove(), 500);
  }, duration);
}

function openInfo(key) {

  document.getElementById('infoTitle').textContent = info.title;

// ============ CAPTCHA ============
let captchaAnswer = 0;
function generateCaptcha() {
  const ops = ['+', '-', '×'];
  const op = ops[Math.floor(Math.random() * ops.length)];
  let a, b, result;
  if (op === '+') {
    a = Math.floor(Math.random() * 9) + 1;
    b = Math.floor(Math.random() * 9) + 1;
    result = a + b;
  } else if (op === '-') {
    a = Math.floor(Math.random() * 8) + 3;
    b = Math.floor(Math.random() * 5) + 1;
    if (a < b) [a, b] = [b, a];
    result = a - b;
  } else {
    a = Math.floor(Math.random() * 4) + 1;
    b = Math.floor(Math.random() * 4) + 1;
    result = a * b;
  }
  captchaAnswer = result;
  document.getElementById('captchaQuestion').textContent = `${a} ${op} ${b} = ?`;
  document.getElementById('captchaInput').value = '';
  document.getElementById('captchaInput').classList.remove('error');
  document.getElementById('verifyError').classList.remove('show');
}

// ============ TERMS CHECKBOX + BUTTON STATE ============
const verifyBtn = document.getElementById('verifyBtn');
const captchaInput = document.getElementById('captchaInput');
const errorEl = document.getElementById('verifyError');
const agreeCheckbox = document.getElementById('agreeTerms');

function updateButtonState() {
  verifyBtn.disabled = !agreeCheckbox.checked;
}

agreeCheckbox.addEventListener('change', updateButtonState);
updateButtonState();

// ============ SUBMIT ============
function submitVerify() {
  if (!agreeCheckbox.checked) {
    errorEl.textContent = '❌ Bạn cần đồng ý với Điều khoản và Chính sách bảo mật';
    errorEl.classList.add('show');
    return;
  }

  const userAnswer = parseInt(captchaInput.value, 10);
  if (isNaN(userAnswer)) {
    errorEl.textContent = '❌ Vui lòng nhập đáp án';
    errorEl.classList.add('show');
    captchaInput.classList.add('error');
    captchaInput.focus();
    return;
  }

  if (userAnswer === captchaAnswer) {
    localStorage.setItem(
      VERIFY_CONFIG.storageKey,
      String(Date.now() + VERIFY_CONFIG.durationMs)
    );
    errorEl.classList.remove('show');
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = '<span>✅ Đang vào web...</span>';
    showToast('Xác minh thành công!', 'success', 1500);
    setTimeout(() => window.location.replace(VERIFY_CONFIG.webUrl), 700);
  } else {
    errorEl.textContent = '❌ Sai đáp án. Thử lại!';
    errorEl.classList.add('show');
    captchaInput.classList.add('error');
    showToast('Sai đáp án, thử lại', 'error', 2000);
    setTimeout(() => {
      generateCaptcha();
      captchaInput.focus();
    }, 800);
  }
}

verifyBtn.addEventListener('click', submitVerify);
captchaInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    submitVerify();
  }
});
captchaInput.addEventListener('input', () => {
  captchaInput.classList.remove('error');
});

    );

});
